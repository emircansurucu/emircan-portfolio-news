name: Investment reports

on:
  workflow_dispatch:
    inputs:
      cadence:
        description: Rapor periyodu
        required: true
        default: daily
        type: choice
        options: [daily, weekly, monthly]
  schedule:
    # Türkiye saati (UTC+3): hafta içi 00:17; önceki ABD işlem gününün kapanışı sonrası.
    - cron: "17 21 * * 1-5"
    # Türkiye saati: Pazar 21:23.
    - cron: "23 18 * * 0"
    # Türkiye saati: Her ayın ilk günü 21:37.
    - cron: "37 18 1 * *"

permissions:
  contents: write

concurrency:
  group: investment-report-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
      IR_FEEDS_JSON: ${{ secrets.IR_FEEDS_JSON }}
      REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
      MAX_LLM_EVENTS_PER_RUN: ${{ vars.MAX_LLM_EVENTS_PER_RUN || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify
        run: |
          ruff check .
          ruff format --check .
          pytest
      - name: Select cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cadence="${{ inputs.cadence }}"
          elif [[ "${{ github.event.schedule }}" == "23 18 * * 0" ]]; then
            cadence="weekly"
          elif [[ "${{ github.event.schedule }}" == "37 18 1 * *" ]]; then
            cadence="monthly"
          else
            cadence="daily"
          fi
          echo "cadence=$cadence" >> "$GITHUB_OUTPUT"
      - name: Generate report
        run: python -m investment_agent "${{ steps.cadence.outputs.cadence }}"
      - name: Upload complete reports
        uses: actions/upload-artifact@v4
        with:
          name: investment-report-${{ steps.cadence.outputs.cadence }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
      - name: Persist successful state and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json data/portfolio_history.jsonl data/processed_events.jsonl reports/*.md reports/*.html
          if [[ -f data/state.json.bak ]]; then git add -f data/state.json.bak; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(reports): update ${{ steps.cadence.outputs.cadence }} report state"
          git push
