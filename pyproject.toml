[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "investment-monitor-agent"
version = "0.1.0"
description = "Source-grounded personal investment monitoring and reporting agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private use" }
dependencies = [
  "edgartools>=4.0",
  "exchange-calendars>=4.5",
  "httpx>=0.27",
  "jinja2>=3.1",
  "markdown>=3.7",
  "numpy>=2.0",
  "openai>=1.50",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "quantstats>=0.0.64",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
investment-agent = "investment_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Turkish output intentionally contains dotted/dotless I characters.
ignore = ["E501", "RUF001"]
